name: Keep Supabase Active

on:
  schedule:
    - cron: "0 0 */5 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keep-alive.yml"

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Profiles Table
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          SUPABASE_URL="${SUPABASE_URL%/}"
          SUPABASE_ANON_KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY secret is empty."
            exit 1
          fi

          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")

          echo "HTTP Status: $STATUS"
          echo "Response Body: $(cat /tmp/response.txt)"

          if [ "$STATUS" -ne 200 ]; then
            exit 1
          fi
